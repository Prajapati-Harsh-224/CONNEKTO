services:
  backend:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 4000 --reload
    environment:
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      DATABASE_URL: sqlite:////app/data/connekto.db
    volumes:
      - ./data:/app/data
      - ./backend/app:/app/app
    ports:
      - "4000:4000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:4000/api/health')
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      API_PROXY_TARGET: http://backend:4000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "http"
      - "frontend:5173"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - frontend
    profiles:
      - tunnel
      - ngrok